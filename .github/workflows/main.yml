  # ==========================================================
  # 8. START WEBSOCKIFY
  # ==========================================================
  - name: 8. Khởi động WebSocket bridge
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $log =
        Join-Path `
          $env:RUNNER_TEMP `
          "websockify.log"

      $errLog =
        Join-Path `
          $env:RUNNER_TEMP `
          "websockify-error.log"

      if (Test-Path $log) {
        Remove-Item `
          $log `
          -Force
      }

      if (Test-Path $errLog) {
        Remove-Item `
          $errLog `
          -Force
      }

      $port =
        [int]$env:VNC_PORT

      Write-Host ""
      Write-Host "Starting websockify..."
      Write-Host "Web port : 6080"
      Write-Host "VNC port : $port"

      $args = @(
        "-m",
        "websockify",
        "--web",
        "`"$env:WEB_DIR`"",
        "6080",
        "127.0.0.1:$port"
      )

      $process =
        Start-Process `
          -FilePath "py" `
          -ArgumentList $args `
          -RedirectStandardOutput $log `
          -RedirectStandardError $errLog `
          -PassThru `
          -WindowStyle Hidden

      Start-Sleep -Seconds 5

      if ($process.HasExited) {

        Write-Host ""
        Write-Host "===== WEBSOCKIFY STDOUT ====="

        if (Test-Path $log) {
          Get-Content $log
        }

        Write-Host ""
        Write-Host "===== WEBSOCKIFY STDERR ====="

        if (Test-Path $errLog) {
          Get-Content $errLog
        }

        throw `
          "websockify exited. ExitCode=$($process.ExitCode)"
      }

      $test =
        Test-NetConnection `
          127.0.0.1 `
          -Port 6080 `
          -WarningAction SilentlyContinue

      if (-not $test.TcpTestSucceeded) {

        Write-Host ""
        Write-Host "===== WEBSOCKIFY STDOUT ====="

        if (Test-Path $log) {
          Get-Content $log
        }

        Write-Host ""
        Write-Host "===== WEBSOCKIFY STDERR ====="

        if (Test-Path $errLog) {
          Get-Content $errLog
        }

        throw `
          "websockify không listen được trên 6080."
      }

      Write-Host ""
      Write-Host "============================================"
      Write-Host "WEBSOCKIFY READY"
      Write-Host "http://127.0.0.1:6080/"
      Write-Host "============================================"


  # ==========================================================
  # 9. LOCAL WEB TEST
  # ==========================================================
  - name: 9. Kiểm tra Web Desktop local
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Start-Sleep -Seconds 2

      try {

        $response =
          Invoke-WebRequest `
            -Uri "http://127.0.0.1:6080/" `
            -UseBasicParsing `
            -TimeoutSec 20

        if ($response.StatusCode -ne 200) {
          throw `
            "HTTP status=$($response.StatusCode)"
        }

        Write-Host `
          "[OK] Local web HTTP 200"

      }
      catch {

        Write-Host ""
        Write-Host "===== LOCAL WEB FAILED ====="

        $log =
          Join-Path `
            $env:RUNNER_TEMP `
            "websockify.log"

        $err =
          Join-Path `
            $env:RUNNER_TEMP `
            "websockify-error.log"

        if (Test-Path $log) {
          Get-Content $log
        }

        if (Test-Path $err) {
          Get-Content $err
        }

        throw `
          "Local web test failed: $($_.Exception.Message)"
      }


  # ==========================================================
  # 10. DOWNLOAD CLOUDFLARED
  # ==========================================================
  - name: 10. Tải cloudflared
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $cf =
        Join-Path `
          $env:RUNNER_TEMP `
          "cloudflared.exe"

      $url =
        "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

      Invoke-WebRequest `
        -Uri $url `
        -OutFile $cf `
        -UseBasicParsing

      if (-not (Test-Path $cf)) {
        throw "cloudflared.exe không tồn tại."
      }

      & $cf --version

      if ($LASTEXITCODE -ne 0) {
        throw "cloudflared không chạy được."
      }

      "CLOUDFLARED=$cf" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      Write-Host "[OK] cloudflared ready."


  # ==========================================================
  # 11. CLEAN CLOUDFLARE CONFIG
  # ==========================================================
  - name: 11. Chuẩn bị Quick Tunnel
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $dir =
        Join-Path `
          $env:USERPROFILE `
          ".cloudflared"

      if (Test-Path $dir) {

        foreach (
          $name in @(
            "config.yml",
            "config.yaml"
          )
        ) {

          $file =
            Join-Path `
              $dir `
              $name

          if (Test-Path $file) {

            Move-Item `
              $file `
              "$file.disabled" `
              -Force

            Write-Host `
              "Disabled $name"
          }
        }
      }

      Write-Host "[OK] Cloudflare environment ready."


  # ==========================================================
  # 12. CLOUDFLARE DNS
  # ==========================================================
  - name: 12. Kiểm tra Cloudflare DNS
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Resolve-DnsName `
        api.trycloudflare.com `
        -ErrorAction Stop |
        Select-Object `
          -First 5 `
          Name,
          Type,
          IPAddress |
        Format-Table

      Write-Host "[OK] Cloudflare DNS works."


  # ==========================================================
  # 13. CREATE QUICK TUNNEL
  # ==========================================================
  - name: 13. Tạo Cloudflare Quick Tunnel
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $logDir =
        Join-Path `
          $env:RUNNER_TEMP `
          "cloudflared"

      if (Test-Path $logDir) {
        Remove-Item `
          $logDir `
          -Recurse `
          -Force
      }

      New-Item `
        -ItemType Directory `
        -Path $logDir `
        -Force |
        Out-Null

      $stdoutLog =
        Join-Path `
          $logDir `
          "stdout.log"

      $stderrLog =
        Join-Path `
          $logDir `
          "stderr.log"

      $psi =
        New-Object `
          System.Diagnostics.ProcessStartInfo

      $psi.FileName =
        $env:CLOUDFLARED

      $psi.Arguments =
        "tunnel --no-autoupdate --url http://127.0.0.1:6080"

      $psi.UseShellExecute =
        $false

      $psi.CreateNoWindow =
        $true

      $psi.RedirectStandardOutput =
        $true

      $psi.RedirectStandardError =
        $true

      $process =
        New-Object `
          System.Diagnostics.Process

      $process.StartInfo =
        $psi

      $process.Start() |
        Out-Null

      $cfPid =
        $process.Id

      Write-Host ""
      Write-Host "cloudflared PID: $cfPid"
      Write-Host ""

      # Close our direct output readers immediately.
      # cloudflared continues running.
      $process.BeginOutputReadLine()
      $process.BeginErrorReadLine()

      # Also poll process output log independently below.
      $publicUrl = $null

      $pattern =
        'https://[A-Za-z0-9-]+\.trycloudflare\.com'

      $deadline =
        (Get-Date).AddSeconds(180)

      Write-Host `
        "Waiting for Cloudflare tunnel..."

      while (
        (Get-Date) -lt $deadline
      ) {

        Start-Sleep -Seconds 2

        # Try stdout
        if (Test-Path $stdoutLog) {

          $text =
            Get-Content `
              $stdoutLog `
              -Raw `
              -ErrorAction SilentlyContinue

          if ($text) {

            $match =
              [regex]::Match(
                $text,
                $pattern
              )

            if ($match.Success) {
              $publicUrl =
                $match.Value
              break
            }
          }
        }

        # Try stderr
        if (Test-Path $stderrLog) {

          $text =
            Get-Content `
              $stderrLog `
              -Raw `
              -ErrorAction SilentlyContinue

          if ($text) {

            $match =
              [regex]::Match(
                $text,
                $pattern
              )

            if ($match.Success) {
              $publicUrl =
                $match.Value
              break
            }
          }
        }

        if ($process.HasExited) {
          break
        }

        Write-Host `
          "Waiting..."
      }

      # Give the process output stream time to flush.
      if (-not $publicUrl) {

        Start-Sleep -Seconds 5

        foreach (
          $file in @(
            $stdoutLog,
            $stderrLog
          )
        ) {

          if (-not (Test-Path $file)) {
            continue
          }

          $text =
            Get-Content `
              $file `
              -Raw `
              -ErrorAction SilentlyContinue

          if ($text) {

            $match =
              [regex]::Match(
                $text,
                $pattern
              )

            if ($match.Success) {
              $publicUrl =
                $match.Value
              break
            }
          }
        }
      }

      if (-not $publicUrl) {

        Write-Host ""
        Write-Host "============================================"
        Write-Host "CLOUDFLARE TUNNEL FAILED"
        Write-Host "============================================"

        Write-Host ""
        Write-Host "===== STDOUT ====="

        if (Test-Path $stdoutLog) {
          Get-Content $stdoutLog
        }
        else {
          Write-Host "(empty)"
        }

        Write-Host ""
        Write-Host "===== STDERR ====="

        if (Test-Path $stderrLog) {
          Get-Content $stderrLog
        }
        else {
          Write-Host "(empty)"
        }

        if (-not $process.HasExited) {
          try {
            $process.Kill()
          }
          catch {
          }
        }

        throw `
          "Cloudflare Quick Tunnel không tạo được."
      }

      $publicUrl =
        $publicUrl.TrimEnd('/')

      "WEB_URL=$publicUrl" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      $publicUrl |
        Out-File `
          "$env:RUNNER_TEMP\public-url.txt" `
          -Encoding utf8

      Write-Host ""
      Write-Host "============================================"
      Write-Host "CLOUDFLARE TUNNEL READY"
      Write-Host "============================================"
      Write-Host ""
      Write-Host "PUBLIC URL:"
      Write-Host ""
      Write-Host $publicUrl
      Write-Host ""


  # ==========================================================
  # 14. KEEP ALIVE
  # ==========================================================
  - name: 14. Giữ Desktop hoạt động
    shell: pwsh
    run: |
      $ErrorActionPreference = "Continue"

      $start =
        [DateTime]::Parse(
          $env:START_TIME
        ).ToUniversalTime()

      $end =
        [DateTime]::Parse(
          $env:END_TIME
        ).ToUniversalTime()

      Write-Host ""
      Write-Host "============================================"
      Write-Host "       KENYUKO DESKTOP ONLINE"
      Write-Host "============================================"
      Write-Host ""
      Write-Host "PUBLIC URL:"
      Write-Host $env:WEB_URL
      Write-Host ""

      while ($true) {

        $now =
          (Get-Date).ToUniversalTime()

        $remaining =
          ($end - $now).TotalSeconds

        if ($remaining -le 0) {
          break
        }

        # VNC
        $vnc =
          Test-NetConnection `
            127.0.0.1 `
            -Port ([int]$env:VNC_PORT) `
            -WarningAction SilentlyContinue

        if (-not $vnc.TcpTestSucceeded) {
          Write-Host ""
          Write-Host "WARNING: VNC stopped."
          break
        }

        # Websockify
        $web =
          Test-NetConnection `
            127.0.0.1 `
            -Port 6080 `
            -WarningAction SilentlyContinue

        if (-not $web.TcpTestSucceeded) {
          Write-Host ""
          Write-Host "WARNING: websockify stopped."
          break
        }

        # Cloudflared
        $cf =
          Get-Process `
            -Name "cloudflared" `
            -ErrorAction SilentlyContinue

        if (-not $cf) {
          Write-Host ""
          Write-Host "WARNING: cloudflared stopped."
          break
        }

        $total =
          [int][math]::Ceiling(
            $remaining
          )

        $hours =
          [int][math]::Floor(
            $total / 3600
          )

        $minutes =
          [int][math]::Floor(
            ($total % 3600) / 60
          )

        $seconds =
          $total % 60

        Write-Host (
          "`rDesktop còn {0:00}:{1:00}:{2:00}     " -f
          $hours,
          $minutes,
          $seconds
        ) -NoNewline

        Start-Sleep -Seconds 5
      }

      Write-Host ""
      Write-Host ""
      Write-Host "============================================"
      Write-Host "           DESKTOP STOPPED"
      Write-Host "============================================"


  # ==========================================================
  # 15. CLEANUP
  # ==========================================================
  - name: 15. Dọn dẹp
    if: always()
    shell: pwsh
    run: |
      Write-Host "Cleanup..."

      Get-Process `
        -Name "cloudflared" `
        -ErrorAction SilentlyContinue |
        Stop-Process `
          -Force `
          -ErrorAction SilentlyContinue

      Get-Process `
        -Name "python" `
        -ErrorAction SilentlyContinue |
        Stop-Process `
          -Force `
          -ErrorAction SilentlyContinue

      Get-Process `
        -Name "py" `
        -ErrorAction SilentlyContinue |
        Stop-Process `
          -Force `
          -ErrorAction SilentlyContinue

      Write-Host "[OK] Cleanup hoàn tất."
```
