```yaml
name: Kenyuko_Web_Desktop

on:
  workflow_dispatch:

concurrency:
  group: kenyuko-web-desktop
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 91

    steps:

      # ==========================================================
      # 0. TIMER
      # ==========================================================
      - name: 0. Bắt đầu timer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $start = (Get-Date).ToUniversalTime()
          $end   = $start.AddMinutes(90)

          "START_TIME=$($start.ToString('o'))" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "END_TIME=$($end.ToString('o'))" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host ""
          Write-Host "============================================" -ForegroundColor Green
          Write-Host "       KENYUKO WEB DESKTOP START" -ForegroundColor Green
          Write-Host "============================================" -ForegroundColor Green
          Write-Host "Start : $($start.ToLocalTime())"
          Write-Host "End   : $($end.ToLocalTime())"
          Write-Host "Time  : 90 minutes"
          Write-Host "============================================"


      # ==========================================================
      # 1. TẠO VNC PASSWORD
      # ==========================================================
      - name: 1. Tạo VNC password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $chars =
            "ABCDEFGHJKLMNPQRSTUVWXYZ" +
            "abcdefghijkmnopqrstuvwxyz" +
            "23456789"

          $password = -join (
            1..8 | ForEach-Object {
              $chars[
                Get-Random `
                  -Minimum 0 `
                  -Maximum $chars.Length
              ]
            }
          )

          "VNC_PASSWORD=$password" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[OK] VNC password đã tạo."


      # ==========================================================
      # 2. TẢI TIGHTVNC
      # ==========================================================
      - name: 2. Tải TightVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Đang lấy TightVNC 64-bit..."

          $page = Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download.php" `
            -UseBasicParsing

          $link = $page.Links |
            Where-Object {
              $_.href -match `
                '(?i)tightvnc.*64bit.*\.msi'
            } |
            Select-Object -First 1

          if (-not $link) {
            throw "Không tìm thấy TightVNC 64-bit MSI."
          }

          $uri = $link.href

          if ($uri -notmatch '^https?://') {
            $uri = [System.Uri]::new(
              [System.Uri]::new(
                "https://www.tightvnc.com/"
              ),
              $uri
            ).AbsoluteUri
          }

          Write-Host "Download URL:"
          Write-Host $uri

          $msi = Join-Path `
            $env:RUNNER_TEMP `
            "tightvnc.msi"

          Invoke-WebRequest `
            -Uri $uri `
            -OutFile $msi `
            -UseBasicParsing

          if (-not (Test-Path $msi)) {
            throw "TightVNC MSI không tồn tại."
          }

          "TIGHTVNC_MSI=$msi" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[OK] TightVNC đã tải."


      # ==========================================================
      # 3. CÀI TIGHTVNC
      # ==========================================================
      - name: 3. Cài TightVNC Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Đang cài TightVNC..."

          $args = @(
            "/i",
            "`"$env:TIGHTVNC_MSI`"",
            "/quiet",
            "/norestart",

            "SET_USEVNCAUTHENTICATION=1",
            "VALUE_OF_USEVNCAUTHENTICATION=1",

            "SET_PASSWORD=1",
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD",

            "SET_VIEWONLYPASSWORD=1",
            "VALUE_OF_VIEWONLYPASSWORD=$env:VNC_PASSWORD"
          )

          $installer = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $args `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($installer.ExitCode -ne 0) {
            throw `
              "TightVNC cài thất bại. ExitCode=$($installer.ExitCode)"
          }

          Write-Host "[OK] TightVNC đã cài."


      # ==========================================================
      # 4. KHỞI ĐỘNG TIGHTVNC
      # ==========================================================
      - name: 4. Khởi động VNC Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Start-Sleep -Seconds 3

          $services = Get-Service |
            Where-Object {
              $_.Name -match '(?i)tightvnc|tvnserver'
            }

          if (-not $services) {
            throw "Không tìm thấy TightVNC service."
          }

          foreach ($svc in $services) {

            Write-Host ""
            Write-Host `
              "Service: $($svc.Name) - $($svc.Status)"

            try {
              Set-Service `
                -Name $svc.Name `
                -StartupType Automatic
            }
            catch {
              Write-Host `
                "Không set StartupType: $($_.Exception.Message)"
            }

            if ($svc.Status -ne "Running") {

              try {
                Start-Service `
                  -Name $svc.Name `
                  -ErrorAction Stop
              }
              catch {
                Write-Host `
                  "Không thể Start-Service: $($_.Exception.Message)"
              }
            }
          }

          Start-Sleep -Seconds 5

          $vncPort = $null

          foreach ($port in @(5900,5901)) {

            Write-Host `
              "Checking VNC port $port..."

            $test = Test-NetConnection `
              127.0.0.1 `
              -Port $port `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $vncPort = $port
              break
            }
          }

          if (-not $vncPort) {

            Write-Host ""
            Write-Host "===== VNC SERVICES ====="

            Get-Service |
              Where-Object {
                $_.Name -match '(?i)tightvnc|tvnserver'
              } |
              Format-Table Name,Status

            Write-Host ""
            Write-Host "===== LISTENING PORTS ====="

            Get-NetTCPConnection `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.LocalPort -in @(5900,5901)
              } |
              Format-Table `
                LocalAddress,
                LocalPort,
                State,
                OwningProcess

            throw `
              "Không tìm thấy VNC listener trên 5900/5901."
          }

          Write-Host ""
          Write-Host "============================================" `
            -ForegroundColor Green

          Write-Host "VNC SERVER READY" `
            -ForegroundColor Green

          Write-Host "Port: $vncPort" `
            -ForegroundColor Green

          Write-Host "============================================" `
            -ForegroundColor Green

          "VNC_PORT=$vncPort" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ==========================================================
      # 5. TẢI NOVNC
      # ==========================================================
      - name: 5. Tải noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir =
            Join-Path `
              $env:RUNNER_TEMP `
              "noVNC"

          if (Test-Path $dir) {
            Remove-Item `
              $dir `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $dir

          if (-not (Test-Path "$dir\vnc.html")) {
            throw "noVNC clone thất bại."
          }

          if (-not (Test-Path "$dir\core\rfb.js")) {
            throw "Không tìm thấy noVNC core/rfb.js."
          }

          "NOVNC_DIR=$dir" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[OK] noVNC ready."


      # ==========================================================
      # 6. CÀI WEBSOCKIFY
      # ==========================================================
      - name: 6. Cài websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          py -m pip install --upgrade pip

          py -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
            throw "Không cài được websockify."
          }

          Write-Host "[OK] websockify installed."


      # ==========================================================
      # 7. CHUẨN BỊ NOVNC WEB
      # ==========================================================
      - name: 7. Chuẩn bị Web Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $webDir =
            Join-Path `
              $env:RUNNER_TEMP `
              "web"

          if (Test-Path $webDir) {
            Remove-Item `
              $webDir `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $webDir `
            -Force |
            Out-Null

          Copy-Item `
            "$env:NOVNC_DIR\*" `
            "$webDir\" `
            -Recurse `
            -Force

          if (-not (Test-Path "$webDir\vnc.html")) {
            throw "Không tìm thấy vnc.html."
          }

          if (-not (Test-Path "$webDir\core\rfb.js")) {
            throw "Không tìm thấy core/rfb.js."
          }

          "WEB_DIR=$webDir" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "============================================" `
            -ForegroundColor Green

          Write-Host `
            "NOVNC WEB DIRECTORY READY" `
            -ForegroundColor Green

          Write-Host "WEB_DIR: $webDir"

          Write-Host "============================================"


      # ==========================================================
      # 8. KHỞI ĐỘNG WEBSOCKIFY
      # ==========================================================
      - name: 8. Khởi động WebSocket bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $stdoutLog =
            Join-Path `
              $env:RUNNER_TEMP `
              "websockify.log"

          $stderrLog =
            Join-Path `
              $env:RUNNER_TEMP `
              "websockify-error.log"

          if (Test-Path $stdoutLog) {
            Remove-Item $stdoutLog -Force
          }

          if (Test-Path $stderrLog) {
            Remove-Item $stderrLog -Force
          }

          $port =
            [int]$env:VNC_PORT

          Write-Host ""
          Write-Host "============================================" `
            -ForegroundColor Cyan

          Write-Host "STARTING WEBSOCKIFY" `
            -ForegroundColor Cyan

          Write-Host "Web port : 6080"
          Write-Host "VNC port : $port"

          Write-Host "============================================"
          Write-Host ""

          $args = @(
            "-m",
            "websockify",
            "--web",
            "`"$env:WEB_DIR`"",
            "6080",
            "127.0.0.1:$port"
          )

          Write-Host `
            "Command: py $($args -join ' ')"

          $process = Start-Process `
            -FilePath "py" `
            -ArgumentList $args `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {

            Write-Host ""
            Write-Host "===== WEBSOCKIFY STDOUT ====="

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }

            Write-Host ""
            Write-Host "===== WEBSOCKIFY STDERR ====="

            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }

            throw `
              "websockify đã thoát. ExitCode=$($process.ExitCode)"
          }

          $test =
            Test-NetConnection `
              127.0.0.1 `
              -Port 6080 `
              -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {

            Write-Host ""
            Write-Host "===== WEBSOCKIFY STDOUT ====="

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }

            Write-Host ""
            Write-Host "===== WEBSOCKIFY STDERR ====="

            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }

            throw `
              "websockify không listen trên port 6080."
          }

          Write-Host ""
          Write-Host "============================================" `
            -ForegroundColor Green

          Write-Host `
            "WEBSOCKIFY READY" `
            -ForegroundColor Green

          Write-Host "http://127.0.0.1:6080/"

          Write-Host "============================================"


      # ==========================================================
      # 9. KIỂM TRA NOVNC LOCAL
      # ==========================================================
      - name: 9. Kiểm tra Web Desktop local
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Start-Sleep -Seconds 2

          Write-Host ""
          Write-Host "Checking:"
          Write-Host "http://127.0.0.1:6080/"
          Write-Host ""

          try {

            $response =
              Invoke-WebRequest `
                -Uri "http://127.0.0.1:6080/" `
                -UseBasicParsing `
                -TimeoutSec 20

            Write-Host `
              "HTTP Status: $($response.StatusCode)"

          }
          catch {

            Write-Host ""
            Write-Host "===== WEBSOCKIFY LOG ====="

            $log =
              Join-Path `
                $env:RUNNER_TEMP `
                "websockify.log"

            $err =
              Join-Path `
                $env:RUNNER_TEMP `
                "websockify-error.log"

            if (Test-Path $log) {
              Get-Content $log
            }

            if (Test-Path $err) {
              Get-Content $err
            }

            throw `
              "Web Desktop localhost:6080 không phản hồi: $($_.Exception.Message)"
          }

          Write-Host "[OK] noVNC web server hoạt động."


      # ==========================================================
      # 10. TẢI CLOUDFLARED
      # ==========================================================
      - name: 10. Tải cloudflared
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cf =
            Join-Path `
              $env:RUNNER_TEMP `
              "cloudflared.exe"

          $url =
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Write-Host "Downloading cloudflared..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cf `
            -UseBasicParsing

          if (-not (Test-Path $cf)) {
            throw "Không tải được cloudflared."
          }

          Write-Host ""
          Write-Host "=== CLOUDFLARED VERSION ==="

          & $cf --version

          if ($LASTEXITCODE -ne 0) {
            throw "cloudflared không chạy được."
          }

          "CLOUDFLARED=$cf" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "[OK] cloudflared ready."


      # ==========================================================
      # 11. RESET CLOUDFLARED CONFIG
      # ==========================================================
      - name: 11. Chuẩn bị Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dir =
            Join-Path `
              $env:USERPROFILE `
              ".cloudflared"

          if (Test-Path $dir) {

            Write-Host ""
            Write-Host "Cloudflared directory:"
            Write-Host $dir

            foreach (
              $name in @(
                "config.yml",
                "config.yaml"
              )
            ) {

              $file =
                Join-Path `
                  $dir `
                  $name

              if (Test-Path $file) {

                $backup =
                  "$file.disabled"

                Move-Item `
                  $file `
                  $backup `
                  -Force

                Write-Host `
                  "Disabled $name"
              }
            }
          }

          Write-Host "[OK] Quick Tunnel environment ready."


      # ==========================================================
      # 12. CLOUDFLARE DNS
      # ==========================================================
      - name: 12. Kiểm tra Cloudflare DNS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=== DNS TEST ==="

          try {

            Resolve-DnsName `
              api.trycloudflare.com `
              -ErrorAction Stop |
              Select-Object `
                -First 5 `
                Name,
                Type,
                IPAddress |
              Format-Table

          }
          catch {

            throw `
              "Runner không resolve được api.trycloudflare.com: $($_.Exception.Message)"
          }

          Write-Host "[OK] Cloudflare DNS hoạt động."


      # ==========================================================
      # 13. TẠO CLOUDFLARE QUICK TUNNEL
      # ==========================================================
      - name: 13. Tạo Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $logDir =
            Join-Path `
              $env:RUNNER_TEMP `
              "cloudflared"

          if (Test-Path $logDir) {
            Remove-Item `
              $logDir `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $logDir `
            -Force |
            Out-Null

          $stdoutLog =
            Join-Path `
              $logDir `
              "stdout.log"

          $stderrLog =
            Join-Path `
              $logDir `
              "stderr.log"

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Cyan

          Write-Host `
            "      START CLOUDFLARE QUICK TUNNEL" `
            -ForegroundColor Cyan

          Write-Host "=================================================="
          Write-Host ""

          # ------------------------------------------------------
          # LOCAL TEST
          # ------------------------------------------------------

          Write-Host "[1/6] Checking localhost:6080..."

          $localTest =
            Test-NetConnection `
              127.0.0.1 `
              -Port 6080 `
              -WarningAction SilentlyContinue

          if (-not $localTest.TcpTestSucceeded) {
            throw "localhost:6080 không hoạt động."
          }

          Write-Host `
            "[OK] localhost:6080 LISTENING" `
            -ForegroundColor Green

          # ------------------------------------------------------
          # PROCESS
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "[2/6] Starting cloudflared..."

          $psi =
            New-Object `
              System.Diagnostics.ProcessStartInfo

          $psi.FileName =
            $env:CLOUDFLARED

          $psi.Arguments =
            "tunnel --no-autoupdate --url http://127.0.0.1:6080"

          $psi.UseShellExecute =
            $false

          $psi.CreateNoWindow =
            $true

          $psi.RedirectStandardOutput =
            $true

          $psi.RedirectStandardError =
            $true

          $process =
            New-Object `
              System.Diagnostics.Process

          $process.StartInfo =
            $psi

          $process.EnableRaisingEvents =
            $true

          $script:PUBLIC_URL =
            $null

          $script:STDOUT_LINES =
            New-Object `
              System.Collections.Concurrent.ConcurrentQueue[string]

          $script:STDERR_LINES =
            New-Object `
              System.Collections.Concurrent.ConcurrentQueue[string]

          $pattern =
            'https://[A-Za-z0-9-]+\.trycloudflare\.com'

          # ------------------------------------------------------
          # OUTPUT EVENTS
          # ------------------------------------------------------

          $stdoutHandler = {

            param(
              $sender,
              $event
            )

            if ($null -eq $event.Data) {
              return
            }

            $line =
              [string]$event.Data

            $script:STDOUT_LINES.Enqueue(
              $line
            )

            try {

              Add-Content `
                -Path $stdoutLog `
                -Value $line `
                -Encoding UTF8

            }
            catch {
            }

            Write-Host `
              "[cloudflared] $line"

            $match =
              [regex]::Match(
                $line,
                $pattern
              )

            if (
              $match.Success -and
              -not $script:PUBLIC_URL
            ) {

              $script:PUBLIC_URL =
                $match.Value
            }
          }

          $stderrHandler = {

            param(
              $sender,
              $event
            )

            if ($null -eq $event.Data) {
              return
            }

            $line =
              [string]$event.Data

            $script:STDERR_LINES.Enqueue(
              $line
            )

            try {

              Add-Content `
                -Path $stderrLog `
                -Value $line `
                -Encoding UTF8

            }
            catch {
            }

            Write-Host `
              "[cloudflared:stderr] $line" `
              -ForegroundColor Yellow

            $match =
              [regex]::Match(
                $line,
                $pattern
              )

            if (
              $match.Success -and
              -not $script:PUBLIC_URL
            ) {

              $script:PUBLIC_URL =
                $match.Value
            }
          }

          $process.add_OutputDataReceived(
            $stdoutHandler
          )

          $process.add_ErrorDataReceived(
            $stderrHandler
          )

          # ------------------------------------------------------
          # START
          # ------------------------------------------------------

          try {

            $started =
              $process.Start()

          }
          catch {

            throw `
              "Không thể start cloudflared: $($_.Exception.Message)"
          }

          if (-not $started) {
            throw "cloudflared Start() trả về false."
          }

          Write-Host ""
          Write-Host `
            "cloudflared PID: $($process.Id)" `
            -ForegroundColor Green

          $process.BeginOutputReadLine()
          $process.BeginErrorReadLine()

          # ------------------------------------------------------
          # WAIT
          # ------------------------------------------------------

          Write-Host ""
          Write-Host `
            "[3/6] Waiting maximum 180 seconds..."
          Write-Host ""

          $deadline =
            (Get-Date).AddSeconds(180)

          while (
            (Get-Date) -lt $deadline
          ) {

            if ($script:PUBLIC_URL) {
              break
            }

            if ($process.HasExited) {

              Start-Sleep `
                -Milliseconds 1500

              if ($script:PUBLIC_URL) {
                break
              }

              Write-Host ""
              Write-Host `
                "cloudflared exited." `
                -ForegroundColor Red

              break
            }

            Start-Sleep `
              -Milliseconds 500
          }

          # ------------------------------------------------------
          # WAIT ASYNC EVENTS
          # ------------------------------------------------------

          if (-not $script:PUBLIC_URL) {

            Write-Host ""
            Write-Host `
              "Waiting for final async output..."

            Start-Sleep -Seconds 3
          }

          # ------------------------------------------------------
          # SCAN LOGS
          # ------------------------------------------------------

          if (-not $script:PUBLIC_URL) {

            Write-Host ""
            Write-Host "[4/6] Scanning logs..."

            foreach (
              $file in @(
                $stdoutLog,
                $stderrLog
              )
            ) {

              if (-not (Test-Path $file)) {
                continue
              }

              $content =
                Get-Content `
                  $file `
                  -Raw `
                  -ErrorAction SilentlyContinue

              if (-not $content) {
                continue
              }

              $match =
                [regex]::Match(
                  $content,
                  $pattern
                )

              if ($match.Success) {

                $script:PUBLIC_URL =
                  $match.Value

                break
              }
            }
          }

          # ------------------------------------------------------
          # FAIL
          # ------------------------------------------------------

          if (-not $script:PUBLIC_URL) {

            Write-Host ""
            Write-Host "==================================================" `
              -ForegroundColor Red

            Write-Host `
              "       CLOUDFLARE QUICK TUNNEL FAILED" `
              -ForegroundColor Red

            Write-Host "==================================================" `
              -ForegroundColor Red

            Write-Host ""
            Write-Host "===== STDOUT =====" `
              -ForegroundColor Yellow

            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            }
            else {
              Write-Host "(empty)"
            }

            Write-Host ""
            Write-Host "===== STDERR =====" `
              -ForegroundColor Yellow

            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            }
            else {
              Write-Host "(empty)"
            }

            Write-Host ""

            if (-not $process.HasExited) {

              try {
                $process.Kill()
              }
              catch {
              }
            }

            throw `
              "Cloudflare Quick Tunnel không tạo được."
          }

          # ------------------------------------------------------
          # SUCCESS
          # ------------------------------------------------------

          $publicUrl =
            $script:PUBLIC_URL.TrimEnd('/')

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Green

          Write-Host `
            "       CLOUDFLARE TUNNEL READY" `
            -ForegroundColor Green

          Write-Host "=================================================="

          Write-Host ""
          Write-Host "PUBLIC URL:"
          Write-Host ""
          Write-Host `
            $publicUrl `
            -ForegroundColor Cyan

          Write-Host ""

          # ------------------------------------------------------
          # SAVE
          # ------------------------------------------------------

          "WEB_URL=$publicUrl" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          $publicUrl |
            Out-File `
              "$env:RUNNER_TEMP\public-url.txt" `
              -Encoding utf8

          Write-Host ""
          Write-Host "[5/6] Tunnel process:"
          Write-Host "PID: $($process.Id)"
          Write-Host "Running: $(-not $process.HasExited)"

          Write-Host ""
          Write-Host "[6/6] Quick Tunnel ready."

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Green

          Write-Host `
            "          KENYUKO DESKTOP READY" `
            -ForegroundColor Green

          Write-Host "==================================================" `
            -ForegroundColor Green

          Write-Host ""
          Write-Host "OPEN:"
          Write-Host ""
          Write-Host `
            $publicUrl `
            -ForegroundColor Cyan

          Write-Host ""

          # QUAN TRỌNG:
          # Không được Kill cloudflared ở step này.
          # Process phải tiếp tục chạy.


      # ==========================================================
      # 14. GIỮ DESKTOP 90 PHÚT
      # ==========================================================
      - name: 14. Giữ Desktop hoạt động
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $start =
            [DateTime]::Parse(
              $env:START_TIME
            ).ToUniversalTime()

          $end =
            [DateTime]::Parse(
              $env:END_TIME
            ).ToUniversalTime()

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "         KENYUKO DESKTOP ONLINE"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "PUBLIC URL:"
          Write-Host ""
          Write-Host `
            $env:WEB_URL `
            -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Desktop đang hoạt động..."
          Write-Host ""

          while ($true) {

            $now =
              (Get-Date).ToUniversalTime()

            $remaining =
              ($end - $now).TotalSeconds

            if ($remaining -le 0) {
              break
            }

            # ----------------------------------------------------
            # Check VNC
            # ----------------------------------------------------

            $vncCheck =
              Test-NetConnection `
                127.0.0.1 `
                -Port ([int]$env:VNC_PORT) `
                -WarningAction SilentlyContinue

            if (-not $vncCheck.TcpTestSucceeded) {

              Write-Host ""
              Write-Host `
                "WARNING: VNC port không còn hoạt động." `
                -ForegroundColor Red

              break
            }

            # ----------------------------------------------------
            # Check websockify
            # ----------------------------------------------------

            $webCheck =
              Test-NetConnection `
                127.0.0.1 `
                -Port 6080 `
                -WarningAction SilentlyContinue

            if (-not $webCheck.TcpTestSucceeded) {

              Write-Host ""
              Write-Host `
                "WARNING: websockify port 6080 đã chết." `
                -ForegroundColor Red

              break
            }

            # ----------------------------------------------------
            # Check cloudflared
            # ----------------------------------------------------

            $cf =
              Get-Process `
                -Name "cloudflared" `
                -ErrorAction SilentlyContinue

            if (-not $cf) {

              Write-Host ""
              Write-Host `
                "WARNING: cloudflared đã dừng." `
                -ForegroundColor Red

              break
            }

            $total =
              [int][math]::Ceiling(
                $remaining
              )

            $hours =
              [int][math]::Floor(
                $total / 3600
              )

            $minutes =
              [int][math]::Floor(
                ($total % 3600) / 60
              )

            $seconds =
              $total % 60

            Write-Host (
              "`rDesktop còn {0:00}:{1:00}:{2:00}     " -f
              $hours,
              $minutes,
              $seconds
            ) -NoNewline

            Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host ""

          Write-Host "============================================" `
            -ForegroundColor Red

          Write-Host `
            "           DESKTOP STOPPED" `
            -ForegroundColor Red

          Write-Host "============================================"


      # ==========================================================
      # 15. CLEANUP
      # ==========================================================
      - name: 15. Dọn dẹp
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "Đang dọn process..."

          Get-Process `
            -Name "cloudflared" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Get-Process `
            -Name "python" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Get-Process `
            -Name "py" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "[OK] Cleanup hoàn tất."
```
