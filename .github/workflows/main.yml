name: Windows RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 100

    steps:

      # ============================================================
      # ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[*] Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "GitHub Actions RDP" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "GitHub Actions RDP" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any |
            Out-Host

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          Write-Host "[OK] RDP enabled."


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "Kenyuko"

          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijkmnopqrstuvwxyz".ToCharArray()
          $digits = "23456789".ToCharArray()

          $special = @(
            [char]33
            [char]64
            [char]35
            [char]36
            [char]37
            [char]95
            [char]45
            [char]43
            [char]61
          )

          $all = $upper + $lower + $digits + $special

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          function Get-RandomChar {
            param(
              [char[]]$Chars
            )

            $bytes = New-Object byte[] 4
            $rng.GetBytes($bytes)

            $number = [BitConverter]::ToUInt32($bytes, 0)

            return $Chars[$number % $Chars.Length]
          }

          $chars = @()

          $chars += Get-RandomChar $upper
          $chars += Get-RandomChar $lower
          $chars += Get-RandomChar $digits
          $chars += Get-RandomChar $special

          while ($chars.Count -lt 20) {
            $chars += Get-RandomChar $all
          }

          for ($i = $chars.Count - 1; $i -gt 0; $i--) {

            $bytes = New-Object byte[] 4
            $rng.GetBytes($bytes)

            $j = [BitConverter]::ToUInt32($bytes, 0) % ($i + 1)

            $tmp = $chars[$i]
            $chars[$i] = $chars[$j]
            $chars[$j] = $tmp
          }

          $password = -join $chars

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
            Remove-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "Kenyuko RDP" `
            -Description "Temporary GitHub Actions RDP account" `
            -PasswordNeverExpires:$true `
            -UserMayNotChangePassword:$true

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "RDP_USER=$username" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "RDP_PASS=$password" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP LOGIN INFORMATION"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "USERNAME : $username"
          Write-Host "PASSWORD : $password"
          Write-Host ""
          Write-Host "=========================================="

          Write-Host "[OK] User created."


      # ============================================================
      # VERIFY RDP
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[*] Checking TermService..."

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name TermService

            Start-Sleep -Seconds 3
          }

          Write-Host "[*] Checking TCP 3389..."

          $listening = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listening) {

            Write-Host "[ERROR] TCP 3389 is not listening."

            exit 1
          }

          $user = Get-LocalUser `
            -Name "Kenyuko" `
            -ErrorAction SilentlyContinue

          if (-not $user) {

            Write-Host "[ERROR] RDP user does not exist."

            exit 1
          }

          Write-Host "[OK] TCP 3389 is listening."
          Write-Host "[OK] RDP user exists."


      # ============================================================
      # INSTALL BORE
      # ============================================================
      - name: Install Bore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[*] Installing Bore TCP tunnel..."

          $dir = Join-Path `
            $env:RUNNER_TEMP `
            "bore"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dir |
            Out-Null

          $api = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" `
            -Headers @{
              "User-Agent" = "GitHub-Actions"
            }

          $asset = $api.assets |
            Where-Object {
              $_.name -match "windows" -and
              $_.name -match "x86_64" -and
              $_.name -match "\.zip$"
            } |
            Select-Object -First 1

          if (-not $asset) {

            Write-Host "[ERROR] Bore Windows x86_64 release not found."

            $api.assets |
              ForEach-Object {
                Write-Host $_.name
              }

            exit 1
          }

          Write-Host "[OK] Bore release: $($asset.name)"

          $zip = Join-Path `
            $dir `
            "bore.zip"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          $bore = Get-ChildItem `
            -Path $dir `
            -Filter "bore.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $bore) {

            Write-Host "[ERROR] bore.exe was not found."

            exit 1
          }

          $borePath = $bore.FullName

          Write-Host "[OK] Bore executable:"
          Write-Host $borePath

          "BORE_EXE=$borePath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8


      # ============================================================
      # START BORE + KEEP RDP ALIVE 90 MINUTES
      # ============================================================
      - name: Start Bore And Keep RDP Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $logDir = Join-Path `
            $env:RUNNER_TEMP `
            "bore"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $logDir |
            Out-Null

          $borePath = $env:BORE_EXE

          if (-not $borePath) {
            Write-Host "[ERROR] BORE_EXE is empty."
            exit 1
          }

          function Start-BoreTunnel {

            $stdoutFile = Join-Path `
              $logDir `
              "stdout.txt"

            $stderrFile = Join-Path `
              $logDir `
              "stderr.txt"

            Remove-Item `
              $stdoutFile `
              -Force `
              -ErrorAction SilentlyContinue

            Remove-Item `
              $stderrFile `
              -Force `
              -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "[*] Starting Bore..."
            Write-Host "[*] Local target: 127.0.0.1:3389"

            $arguments = @(
              "local"
              "3389"
              "--to"
              "bore.pub"
            )

            $process = Start-Process `
              -FilePath $borePath `
              -ArgumentList $arguments `
              -WorkingDirectory $logDir `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile `
              -PassThru `
              -WindowStyle Hidden

            if (-not $process) {
              Write-Host "[ERROR] Could not start Bore."
              return $null
            }

            Write-Host "[OK] Bore PID: $($process.Id)"

            for ($i = 0; $i -lt 30; $i++) {

              Start-Sleep -Seconds 1

              $output = ""

              if (Test-Path $stdoutFile) {
                $output += Get-Content `
                  -Path $stdoutFile `
                  -Raw `
                  -ErrorAction SilentlyContinue
              }

              if (Test-Path $stderrFile) {
                $output += "`n"
                $output += Get-Content `
                  -Path $stderrFile `
                  -Raw `
                  -ErrorAction SilentlyContinue
              }

              $match = [regex]::Match(
                $output,
                'listening at ([a-zA-Z0-9.-]+):([0-9]+)',
                [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
              )

              if ($match.Success) {

                $address = "$($match.Groups[1].Value):$($match.Groups[2].Value)"

                Write-Host ""
                Write-Host "=========================================="
                Write-Host "       RDP TCP TUNNEL IS ONLINE"
                Write-Host "=========================================="
                Write-Host ""
                Write-Host "ADDRESS  : $address"
                Write-Host "USERNAME : $env:RDP_USER"
                Write-Host "PASSWORD : $env:RDP_PASS"
                Write-Host ""
                Write-Host "MSTSC:"
                Write-Host "mstsc /v:$address"
                Write-Host ""
                Write-Host "=========================================="

                "RDP_ADDRESS=$address" |
                  Out-File `
                    -FilePath $env:GITHUB_ENV `
                    -Append `
                    -Encoding utf8

                return [PSCustomObject]@{
                  Process = $process
                  Address = $address
                }
              }

              if ($process.HasExited) {
                break
              }
            }

            Write-Host ""
            Write-Host "========== BORE OUTPUT =========="

            if (Test-Path $stdoutFile) {
              Get-Content `
                -Path $stdoutFile `
                -ErrorAction SilentlyContinue
            }

            if (Test-Path $stderrFile) {
              Get-Content `
                -Path $stderrFile `
                -ErrorAction SilentlyContinue
            }

            Write-Host "================================="

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue

            return $null
          }


          # ========================================================
          # INITIAL BORE CONNECTION
          # ========================================================

          $tunnel = Start-BoreTunnel

          if (-not $tunnel) {

            Write-Host "[ERROR] Initial Bore connection failed."

            exit 1
          }


          # ========================================================
          # 90 MINUTES
          #
          # Check every 5 seconds.
          # This makes workflow cancellation much more responsive.
          # ========================================================

          $totalSeconds = 90 * 60
          $elapsed = 0
          $nextStatus = 0

          while ($elapsed -lt $totalSeconds) {

            Start-Sleep -Seconds 5

            $elapsed += 5

            # ------------------------------------------------------
            # Check RDP service
            # ------------------------------------------------------

            $service = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            if ($service -and $service.Status -ne "Running") {

              Write-Host "[!] TermService stopped. Restarting..."

              Start-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue
            }


            # ------------------------------------------------------
            # Check TCP 3389
            # ------------------------------------------------------

            $rdpPort = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if (-not $rdpPort) {

              Write-Host "[!] TCP 3389 stopped listening."
              Write-Host "[*] Restarting TermService..."

              Start-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
            }


            # ------------------------------------------------------
            # Check Bore
            # ------------------------------------------------------

            $boreProcess = $null

            if ($tunnel -and $tunnel.Process) {

              $boreProcess = Get-Process `
                -Id $tunnel.Process.Id `
                -ErrorAction SilentlyContinue
            }

            if (-not $boreProcess) {

              Write-Host ""
              Write-Host "[!] Bore tunnel stopped."
              Write-Host "[*] Reconnecting..."
              Write-Host ""

              $newTunnel = Start-BoreTunnel

              if ($newTunnel) {

                $tunnel = $newTunnel

                Write-Host ""
                Write-Host "[OK] Bore reconnected."
                Write-Host "[OK] NEW RDP ADDRESS: $($tunnel.Address)"
                Write-Host ""
              }
              else {

                Write-Host "[!] Reconnect failed."
                Write-Host "[*] Will retry..."
              }
            }


            # ------------------------------------------------------
            # STATUS EVERY 60 SECONDS
            # ------------------------------------------------------

            if ($elapsed -ge $nextStatus) {

              $minutes = [math]::Floor($elapsed / 60)
              $seconds = $elapsed % 60

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "RDP STATUS"
              Write-Host "=========================================="
              Write-Host "TIME    : $minutes min $seconds sec / 90 min"
              Write-Host "ADDRESS : $($tunnel.Address)"
              Write-Host "USER    : $env:RDP_USER"
              Write-Host "PASSWORD: $env:RDP_PASS"
              Write-Host "=========================================="
              Write-Host ""

              $nextStatus = $nextStatus + 60
            }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       90 MINUTES COMPLETED"
          Write-Host "=========================================="
          Write-Host ""


      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "[*] Cleaning up..."

          # Stop Bore processes
          Get-Process `
            -Name "bore" `
            -ErrorAction SilentlyContinue |
            Stop-Process `
              -Force `
              -ErrorAction SilentlyContinue

          # Remove firewall rule
          Remove-NetFirewallRule `
            -DisplayName "GitHub Actions RDP" `
            -ErrorAction SilentlyContinue

          # Remove temporary user
          Remove-LocalUser `
            -Name "Kenyuko" `
            -ErrorAction SilentlyContinue

          Write-Host "[OK] Cleanup completed."
