steps:

  # ==========================================================
  # 0. TIMER
  # ==========================================================
  - name: 0. Bắt đầu timer
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $start = (Get-Date).ToUniversalTime()
      $end   = $start.AddMinutes(90)

      "START_TIME=$($start.ToString('o'))" |
        Out-File $env:GITHUB_ENV -Append -Encoding utf8

      "END_TIME=$($end.ToString('o'))" |
        Out-File $env:GITHUB_ENV -Append -Encoding utf8

      Write-Host "============================================"
      Write-Host "       KENYUKO WEB DESKTOP START"
      Write-Host "============================================"
      Write-Host "Start : $($start.ToLocalTime())"
      Write-Host "End   : $($end.ToLocalTime())"
      Write-Host "Time  : 90 minutes"
      Write-Host "============================================"


  # ==========================================================
  # 1. VNC PASSWORD
  # ==========================================================
  - name: 1. Tạo VNC password
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ" +
        "abcdefghijkmnopqrstuvwxyz" +
        "23456789"

      $password = -join (
        1..8 | ForEach-Object {
          $chars[
            Get-Random `
              -Minimum 0 `
              -Maximum $chars.Length
          ]
        }
      )

      "VNC_PASSWORD=$password" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      Write-Host "[OK] VNC password created."


  # ==========================================================
  # 2. DOWNLOAD TIGHTVNC
  # ==========================================================
  - name: 2. Tải TightVNC
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Write-Host "Downloading TightVNC..."

      $page = Invoke-WebRequest `
        -Uri "https://www.tightvnc.com/download.php" `
        -UseBasicParsing

      $link = $page.Links |
        Where-Object {
          $_.href -match '(?i)tightvnc.*64bit.*\.msi'
        } |
        Select-Object -First 1

      if (-not $link) {
        throw "Không tìm thấy TightVNC 64-bit MSI."
      }

      $uri = $link.href

      if ($uri -notmatch '^https?://') {
        $uri = [System.Uri]::new(
          [System.Uri]::new(
            "https://www.tightvnc.com/"
          ),
          $uri
        ).AbsoluteUri
      }

      $msi =
        Join-Path `
          $env:RUNNER_TEMP `
          "tightvnc.msi"

      Invoke-WebRequest `
        -Uri $uri `
        -OutFile $msi `
        -UseBasicParsing

      if (-not (Test-Path $msi)) {
        throw "TightVNC MSI không tồn tại."
      }

      "TIGHTVNC_MSI=$msi" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      Write-Host "[OK] TightVNC downloaded."


  # ==========================================================
  # 3. INSTALL TIGHTVNC
  # ==========================================================
  - name: 3. Cài TightVNC Server
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $args = @(
        "/i",
        "`"$env:TIGHTVNC_MSI`"",
        "/quiet",
        "/norestart",

        "SET_USEVNCAUTHENTICATION=1",
        "VALUE_OF_USEVNCAUTHENTICATION=1",

        "SET_PASSWORD=1",
        "VALUE_OF_PASSWORD=$env:VNC_PASSWORD",

        "SET_VIEWONLYPASSWORD=1",
        "VALUE_OF_VIEWONLYPASSWORD=$env:VNC_PASSWORD"
      )

      $installer =
        Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList $args `
          -Wait `
          -PassThru `
          -NoNewWindow

      if ($installer.ExitCode -ne 0) {
        throw `
          "TightVNC installation failed. ExitCode=$($installer.ExitCode)"
      }

      Write-Host "[OK] TightVNC installed."


  # ==========================================================
  # 4. START VNC
  # ==========================================================
  - name: 4. Khởi động VNC Server
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      Start-Sleep -Seconds 5

      $services =
        Get-Service |
        Where-Object {
          $_.Name -match '(?i)tightvnc|tvnserver'
        }

      if (-not $services) {
        throw "Không tìm thấy TightVNC service."
      }

      foreach ($svc in $services) {

        Write-Host `
          "Service: $($svc.Name) Status=$($svc.Status)"

        try {
          Set-Service `
            -Name $svc.Name `
            -StartupType Automatic
        }
        catch {
        }

        if ($svc.Status -ne "Running") {

          try {
            Start-Service `
              -Name $svc.Name `
              -ErrorAction Stop
          }
          catch {
            Write-Host `
              "Start-Service failed: $($_.Exception.Message)"
          }
        }
      }

      Start-Sleep -Seconds 5

      $vncPort = $null

      foreach ($port in @(5900,5901)) {

        $test =
          Test-NetConnection `
            127.0.0.1 `
            -Port $port `
            -WarningAction SilentlyContinue

        if ($test.TcpTestSucceeded) {
          $vncPort = $port
          break
        }
      }

      if (-not $vncPort) {

        Write-Host ""
        Write-Host "===== VNC SERVICES ====="

        Get-Service |
          Where-Object {
            $_.Name -match '(?i)tightvnc|tvnserver'
          } |
          Format-Table Name,Status

        throw `
          "Không tìm thấy VNC listener trên 5900 hoặc 5901."
      }

      "VNC_PORT=$vncPort" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      Write-Host ""
      Write-Host "============================================"
      Write-Host "VNC SERVER READY"
      Write-Host "Port: $vncPort"
      Write-Host "============================================"


  # ==========================================================
  # 5. DOWNLOAD NOVNC
  # ==========================================================
  - name: 5. Tải noVNC
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $dir =
        Join-Path `
          $env:RUNNER_TEMP `
          "noVNC"

      if (Test-Path $dir) {
        Remove-Item `
          $dir `
          -Recurse `
          -Force
      }

      git clone `
        --depth 1 `
        https://github.com/novnc/noVNC.git `
        $dir

      if (-not (Test-Path "$dir\vnc.html")) {
        throw "noVNC vnc.html không tồn tại."
      }

      if (-not (Test-Path "$dir\core\rfb.js")) {
        throw "noVNC core/rfb.js không tồn tại."
      }

      "NOVNC_DIR=$dir" |
        Out-File `
          $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

      Write-Host "[OK] noVNC ready."


  # ==========================================================
  # 6. INSTALL WEBSOCKIFY
  # ==========================================================
  - name: 6. Cài websockify
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      py -m pip install --upgrade pip

      py -m pip install websockify

      if ($LASTEXITCODE -ne 0) {
        throw "Cài websockify thất bại."
      }

      Write-Host "[OK] websockify installed."


  # ==========================================================
  # 7. CREATE WEB APP
  # ==========================================================
  - name: 7. Tạo Web Desktop
    shell: pwsh
    run: |
      $ErrorActionPreference = "Stop"

      $webDir =
        Join-Path `
          $env:RUNNER_TEMP `
          "web"

      if (Test-Path $webDir) {
        Remove-Item `
          $webDir `
          -Recurse `
          -Force
      }

      New-Item `
        -ItemType Directory `
        -Path $webDir `
        -Force |
        Out-Null

      Copy-Item `
        "$env:NOVNC_DIR\*" `
        "$webDir\" `
        -Recurse `
        -Force

      $password =
        $env:VNC_PASSWORD

      $html = @"
