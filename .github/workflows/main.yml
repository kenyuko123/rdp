<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Kenyuko Desktop</title>

<style>

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

#screen {
  width: 100%;
  height: 100%;
}

#loading {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: #fff;
  font-family: Arial,sans-serif;
  font-size: 18px;
  z-index: 1000;
}

#error {
  display: none;
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  max-width: 80%;
  padding: 24px;
  border-radius: 10px;
  background: #222;
  color: #fff;
  font-family: Arial,sans-serif;
  white-space: pre-wrap;
  z-index: 2000;
}

</style>

</head>

<body>

<div id="loading">
  Connecting to desktop...
</div>

<div id="error"></div>

<div id="screen"></div>

<script type="module">

import RFB from "./core/rfb.js";

const screen =
  document.getElementById("screen");

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const protocol =
  location.protocol === "https:"
    ? "wss://"
    : "ws://";

const websocketUrl =
  protocol +
  location.host +
  "/websockify";

console.log(
  "WebSocket:",
  websocketUrl
);

try {

  const rfb =
    new RFB(
      screen,
      websocketUrl,
      {
        credentials: {
          password: "$password"
        },

        shared: true
      }
    );

  rfb.scaleViewport = true;

  rfb.resizeSession = false;

  rfb.showDotCursor = true;

  rfb.addEventListener(
    "connect",
    () => {

      console.log(
        "VNC connected"
      );

      loading.style.display =
        "none";
    }
  );

  rfb.addEventListener(
    "credentialsrequired",
    () => {

      rfb.sendCredentials(
        {
          password: "$password"
        }
      );

    }
  );

  rfb.addEventListener(
    "disconnect",
    event => {

      console.log(
        "VNC disconnected",
        event
      );

      loading.style.display =
        "flex";

      loading.textContent =
        "Desktop đã ngắt kết nối.";
    }
  );

  window.rfb = rfb;

}
catch (error) {

  console.error(error);

  loading.style.display =
    "none";

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "Không thể kết nối desktop:\n" +
    error.message;
}

</script>

</body>

</html>
