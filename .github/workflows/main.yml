      $html |
        Out-File `
          "$webDir\index.html" `
          -Encoding utf8

      if (-not (Test-Path "$webDir\index.html")) {
        throw "Không tạo được index.html."
      }

      "WEB_DIR=$webDir" |
        Out-File `
          $env:GITHUB_ENV `
